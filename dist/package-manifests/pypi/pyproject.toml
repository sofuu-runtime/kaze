[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kaze-lang"
version = "1.0.0"
description = "Compiler and tooling for the Kaze systems programming language"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Sofuu Runtime" }]
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Compilers",
]

[project.urls]
Homepage = "https://github.com/sofuu-runtime/kaze"
Repository = "https://github.com/sofuu-runtime/kaze"
Issues = "https://github.com/sofuu-runtime/kaze/issues"
